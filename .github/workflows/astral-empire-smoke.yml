name: Astral Empire smoke tests

on:
  push:
    paths:
      - 'docs/games/astral-empire/**'
      - '.github/workflows/astral-empire-smoke.yml'
  pull_request:
    paths:
      - 'docs/games/astral-empire/**'
      - '.github/workflows/astral-empire-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Classic, action RPG, and browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        working-directory: docs/games/astral-empire
        run: npm ci
      - name: Compile the C++ WebAssembly module
        working-directory: docs/games/astral-empire
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          CXX=clang++ npm run build:native
      - name: Test mechanics and save compatibility
        working-directory: docs/games/astral-empire
        run: npm test
      - name: Install Chromium
        working-directory: docs/games/astral-empire
        run: npx playwright install --with-deps chromium
      - name: Test the playable browser loop
        working-directory: docs/games/astral-empire
        run: npm run test:browser
      - name: Render realms and check visual resource budgets
        working-directory: docs/games/astral-empire
        run: npm run test:visual
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherbound-browser-screenshots
          path: docs/games/astral-empire/.artifacts/
          if-no-files-found: ignore
          include-hidden-files: true
