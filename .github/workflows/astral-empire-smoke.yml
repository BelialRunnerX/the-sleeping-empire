name: Astral Empire smoke tests

on:
  push:
    paths:
      - 'docs/games/astral-empire/**'
      - '.github/workflows/astral-empire-smoke.yml'
  pull_request:
    paths:
      - 'docs/games/astral-empire/**'
      - '.github/workflows/astral-empire-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Game mechanics regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game mechanics and save compatibility
        run: node docs/games/astral-empire/tests/smoke.mjs
