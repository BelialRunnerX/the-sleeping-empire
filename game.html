<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeping Empire • Roguelite</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Orbitron:wght@500;700&amp;display=swap');
        
        :root {
            --accent: #00f3ff;
        }
        
        body {
            margin: 0;
            background: #0a0c14;
            color: #e0f7fa;
            font-family: 'Inter', system_ui, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        @media (min-width: 768px) {
            #game-container {
                flex-direction: row;
            }
        }
        
        #map-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000011;
            position: relative;
        }
        
        canvas {
            border: 3px solid #00f3ff;
            image-rendering: pixelated;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            max-width: 100%;
            max-height: 100vh;
        }
        
        #ui {
            width: 100%;
            background: #12141f;
            border-top: 1px solid #00f3ff;
            padding: 20px;
            overflow-y: auto;
        }
        
        @media (min-width: 768px) {
            #ui {
                width: 340px;
                border-top: none;
                border-left: 1px solid #00f3ff;
                padding: 28px;
            }
        }
        
        .section-title {
            font-family: 'Orbitron', sans-serif;
            color: #00f3ff;
            font-size: 1rem;
            margin-bottom: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        .stat {
            margin-bottom: 10px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
        }
        
        #inventory {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .item {
            background: #1a1f2e;
            border: 1px solid #00f3ff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            flex: 1 1 45%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="map-container">
            <canvas id="game-canvas" width="800" height="600"></canvas>
        </div>
        
        <div id="ui">
            <div class="section-title">Operative</div>
            <div id="character-info"></div>
            
            <div class="section-title" style="margin-top: 28px;">Inventory</div>
            <div id="inventory"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
