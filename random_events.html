<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Event Generator - The Sleeping Empire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        button {
            background-color: #1a3c6e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
        }
        button:hover {
            background-color: #2a5aa0;
        }
        .event-box {
            background-color: #1a1a1a;
            border: 1px solid #444;
            padding: 20px;
            margin: 20px 0;
            min-height: 120px;
            border-radius: 8px;
        }
        .good {
            border-color: #2e7d32;
        }
        .bad {
            border-color: #c62828;
        }
        h1 {
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nexus Trade World - Random Event Generator</h1>
        <p>Press the button to generate a random event in the Sleeping Empire.</p>
        
        <button onclick="generateEvent()">Generate Event</button>
        
        <div id="event-display" class="event-box">
            <p>Click the button above to begin...</p>
        </div>
    </div>

    <script>
        const goodEvents = [
            "A merchant fleet discovers a rich asteroid field and offers you exclusive trading rights.",
            "An unknown benefactor deposits a large sum of credits into your account with no explanation.",
            "You receive a personal invitation to a high-level diplomatic summit.",
            "A prototype AI core is gifted to you by an anonymous source.",
            "Local factions begin treating you with noticeably more respect after recent events.",
            "You stumble upon a cache of ancient Imperial technology.",
            "A powerful noble offers you their patronage.",
            "Your reputation spreads, attracting skilled recruits to your service.",
            "A mysterious trader sells you a relic at a suspiciously low price.",
            "The Nexus Trade World grants you a temporary tax exemption."
        ];

        const badEvents = [
            "Pirates ambush one of your trade convoys and steal valuable cargo.",
            "A powerful faction places a bounty on your head.",
            "Your neural implant begins malfunctioning at the worst possible time.",
            "A trusted contact is revealed to be a double agent.",
            "Local authorities begin scrutinizing your activities more closely.",
            "A mysterious illness begins affecting your crew.",
            "One of your key allies suffers a major political setback.",
            "A valuable relic you acquired turns out to be a fake.",
            "The Dominion issues a formal complaint about your recent activities.",
            "A dimensional anomaly disrupts your supply lines."
        ];

        function generateEvent() {
            const isGood = Math.random() > 0.5;
            const events = isGood ? goodEvents : badEvents;
            const randomIndex = Math.floor(Math.random() * events.length);
            const eventText = events[randomIndex];
            
            const display = document.getElementById('event-display');
            display.innerHTML = `<p>${eventText}</p>`;
            display.className = isGood ? 'event-box good' : 'event-box bad';
        }
    </script>
</body>
</html>
