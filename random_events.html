<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Event Generator - The Sleeping Empire</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        button { background: #1a3c6e; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 20px 0; }
        button:hover { background: #2a5aa0; }
        .event { background: #1a1a1a; padding: 25px; border-radius: 10px; margin: 20px 0; }
        .good { border-left: 6px solid #2e7d32; }
        .bad { border-left: 6px solid #c62828; }
        .neutral { border-left: 6px solid #f9a825; }
        h1 { color: #4fc3f7; }
    </style>
</head>
<body>
<div class="container">
    <h1>Advanced Random Event Generator</h1>
    <p>Generates contextual events with stat and gear-based branching.</p>
    
    <button onclick="generateEvent()">Generate Event</button>
    
    <div id="result" class="event">
        <p>Click the button to generate a scenario...</p>
    </div>
</div>

<script>
// ==================== EXPANDED CONTENT ====================
const locations = [
    "Nexus Trade World", "Docking Bays", "Observation Deck", 
    "Lower Markets", "Voidspire District", "Imperial Archives",
    "The Nullspire Perimeter", "Outer Ring Hab-Modules", "Senate District"
];

const eventTypes = [
    "Opportunity", "Conflict", "Mystery", "Betrayal", 
    "Discovery", "Threat", "Political", "Psionic Disturbance"
];

const complications = [
    "involves a rival faction", "is connected to the Nullborn",
    "involves an ancient subordinate", "is being watched by Sentinel",
    "relates to a lost Imperial relic", "involves The Warden",
    "is tied to the Concord", "involves a Dominion defector",
    "is linked to dimensional instability", "involves a high-ranking noble"
];

const goodOutcomes = [
    "You gain a powerful new contact.",
    "You acquire valuable technology or information.",
    "Your reputation increases significantly.",
    "You receive unexpected support from a hidden ally.",
    "You gain access to a restricted area or resource.",
    "You earn a favor that may prove useful later."
];

const badOutcomes = [
    "You make a powerful enemy.",
    "You lose access to a valuable resource.",
    "Your actions draw unwanted attention.",
    "You suffer a setback that affects your standing.",
    "You are forced into a difficult political position.",
    "One of your allies is compromised."
];

const neutralOutcomes = [
    "The situation resolves with mixed results.",
    "You gain information but at a cost.",
    "The event creates new opportunities and new risks.",
    "You must make a difficult choice with no clear winner.",
    "The outcome leaves you with more questions than answers."
];

// ==================== ADVANCED EVENT GENERATOR ====================
function generateEvent() {
    // Try to load character from localStorage
    let char = null;
    try {
        const saved = localStorage.getItem('sleepingEmpireCharacter');
        if (saved) char = JSON.parse(saved);
    } catch (e) {}

    const location = locations[Math.floor(Math.random() * locations.length)];
    const type = eventTypes[Math.floor(Math.random() * eventTypes.length)];
    const complication = complications[Math.floor(Math.random() * complications.length)];
    
    let outcome = "";
    let className = "neutral";

    const roll = Math.random();

    // === Branching Logic ===
    // High Intelligence helps with Mystery/Discovery
    if ((type === "Mystery" || type === "Discovery") && char && char.intelligence >= 15) {
        outcome = goodOutcomes[Math.floor(Math.random() * goodOutcomes.length)];
        className = "good";
    } 
    // High Presence helps with Opportunity/Political
    else if ((type === "Opportunity" || type === "Political") && char && char.presence >= 15) {
        outcome = goodOutcomes[Math.floor(Math.random() * goodOutcomes.length)];
        className = "good";
    } 
    // Low Reflexes hurts during Threat/Conflict
    else if ((type === "Threat" || type === "Conflict") && char && char.reflexes <= 8) {
        outcome = badOutcomes[Math.floor(Math.random() * badOutcomes.length)];
        className = "bad";
    } 
    // Legendary weapon gives advantage in Conflict
    else if (type === "Conflict" && char && char.weapon1_tier === "Legendary") {
        outcome = goodOutcomes[Math.floor(Math.random() * goodOutcomes.length)];
        className = "good";
    } 
    // Default random outcome
    else {
        if (roll < 0.35) {
            outcome = goodOutcomes[Math.floor(Math.random() * goodOutcomes.length)];
            className = "good";
        } else if (roll < 0.7) {
            outcome = badOutcomes[Math.floor(Math.random() * badOutcomes.length)];
            className = "bad";
        } else {
            outcome = neutralOutcomes[Math.floor(Math.random() * neutralOutcomes.length)];
            className = "neutral";
        }
    }

    const eventText = `While in the <strong>${location}</strong>, you encounter a <strong>${type}</strong> that <strong>${complication}</strong>. As a result, <strong>${outcome}</strong>.`;

    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = `<p>${eventText}</p>`;
    resultDiv.className = `event ${className}`;
}
</script>
</body>
</html>
