<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sleeping Empire - Text Adventure</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        #game-area { background: #1a1a1a; padding: 25px; border-radius: 10px; min-height: 280px; margin-bottom: 20px; }
        .choice { background: #1a3c6e; color: white; border: none; padding: 12px 20px; margin: 8px 0; width: 100%; text-align: left; cursor: pointer; }
        .choice:hover { background: #2a5aa0; }
        .status { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        button { background: #1a3c6e; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }
        button:hover { background: #2a5aa0; }
        h1 { color: #4fc3f7; }
    </style>
</head>
<body>
<div class="container">
    <h1>The Sleeping Empire - Text Adventure</h1>
    
    <div class="status">
        <strong>Character:</strong> <span id="char-name">None Loaded</span><br>
        <strong>Location:</strong> <span id="location">Nexus Trade World</span><br>
        <strong>Favor:</strong> <span id="favor">0</span> | <strong>Suspicion:</strong> <span id="suspicion">0</span>
    </div>

    <div id="game-area">
        <p>Welcome. Load a character or start a new game.</p>
    </div>

    <div id="choices"></div>

    <div style="margin-top: 30px;">
        <button onclick="loadSavedCharacter()">Load Character</button>
        <button onclick="startNewGame()">New Game</button>
        <button onclick="saveGame()">Save Game</button>
    </div>
</div>

<script>
// ==================== GAME STATE ====================
let gameState = {
    character: null,
    location: "Nexus Trade World",
    favor: 0,
    suspicion: 0,
    storyFlags: {}
};

function updateUI() {
    if (!gameState.character) return;
    document.getElementById('char-name').innerText = gameState.character.name;
    document.getElementById('location').innerText = gameState.location;
    document.getElementById('favor').innerText = gameState.favor;
    document.getElementById('suspicion').innerText = gameState.suspicion;
}

// ==================== STORY & CHOICES ====================
function showMessage(text) {
    document.getElementById('game-area').innerHTML = `<p>${text}</p>`;
}

function showChoices(choices) {
    const container = document.getElementById('choices');
    container.innerHTML = '';
    
    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.innerText = choice.text;
        btn.onclick = choice.action;
        container.appendChild(btn);
    });
}

// ==================== LOCATIONS ====================
function goToLocation(location) {
    gameState.location = location;
    updateUI();
    
    let text = `You arrive at the ${location}.`;
    let choices = [];

    if (location === "Trading Hall") {
        text += " Merchants from various factions are active.";
        choices = [
            { text: "Look for trade opportunities", action: () => triggerAdvancedEncounter() },
            { text: "Eavesdrop on conversations", action: () => eavesdrop() },
            { text: "Return to main area", action: () => goToLocation("Nexus Trade World") }
        ];
    } 
    else if (location === "Docking Bays") {
        text += " Several ships are docked, including an unmarked vessel.";
        choices = [
            { text: "Investigate the unmarked ship", action: () => investigateShip() },
            { text: "Speak with a dock worker", action: () => triggerAdvancedEncounter() },
            { text: "Return to main area", action: () => goToLocation("Nexus Trade World") }
        ];
    } 
    else if (location === "Observation Deck") {
        text += " You notice strange energy readings in the distance.";
        choices = [
            { text: "Scan the anomaly", action: () => scanAnomaly() },
            { text: "Return to main area", action: () => goToLocation("Nexus Trade World") }
        ];
    }

    showMessage(text);
    showChoices(choices);
}

// ==================== ADVANCED ENCOUNTER SYSTEM ====================
const encounterTypes = ["Combat", "Social", "Psionic", "Trade", "Exploration", "Mystery"];

function triggerAdvancedEncounter() {
    if (!gameState.character) {
        alert("Please generate or load a character first.");
        return;
    }

    const char = gameState.character;
    const type = encounterTypes[Math.floor(Math.random() * encounterTypes.length)];
    const location = gameState.location;

    let eventText = `While in the ${location}, you encounter a ${type} situation.`;
    let choices = [];

    if (type === "Combat") {
        eventText += " Hostile forces are engaging you.";
        choices = generateCombatChoices(char);
    } 
    else if (type === "Social") {
        eventText += " A tense negotiation is unfolding.";
        choices = generateSocialChoices(char);
    } 
    else if (type === "Psionic") {
        eventText += " You feel a psionic disturbance.";
        choices = generatePsionicChoices(char);
    } 
    else if (type === "Trade") {
        eventText += " A high-stakes trade opportunity appears.";
        choices = generateTradeChoices(char);
    } 
    else if (type === "Exploration") {
        eventText += " You discover something unusual.";
        choices = generateExplorationChoices(char);
    } 
    else if (type === "Mystery") {
        eventText += " Something doesn't add up.";
        choices = generateMysteryChoices(char);
    }

    showMessage(eventText);
    showChoices(choices);
}

// ==================== ENCOUNTER TYPE GENERATORS ====================
function generateCombatChoices(char) {
    return [
        { text: "Engage with your weapon", action: () => resolveCombat(char, "weapon") },
        { text: "Use Psionics", action: () => resolveCombat(char, "psionic") },
        { text: "Try to negotiate", action: () => resolveCombat(char, "social") },
        { text: "Attempt to flee", action: () => resolveCombat(char, "flee") }
    ];
}

function generateSocialChoices(char) {
    return [
        { text: "Use your Presence to de-escalate", action: () => resolveSocial(char) },
        { text: "Offer a trade deal", action: () => resolveTrade(char) },
        { text: "Threaten them", action: () => resolveCombat(char, "social") }
    ];
}

function generatePsionicChoices(char) {
    return [
        { text: "Resist the psionic pressure", action: () => resolvePsionic(char) },
        { text: "Attempt to read their intentions", action: () => resolvePsionic(char) },
        { text: "Counter with your own psionics", action: () => resolveCombat(char, "psionic") }
    ];
}

function generateTradeChoices(char) {
    return [
        { text: "Negotiate aggressively", action: () => resolveTrade(char) },
        { text: "Use Intelligence to spot the angle", action: () => resolveTrade(char) },
        { text: "Walk away", action: () => showMessage("You choose not to engage.") }
    ];
}

function generateExplorationChoices(char) {
    return [
        { text: "Investigate carefully", action: () => resolveExploration(char) },
        { text: "Use technology to scan", action: () => resolveExploration(char) },
        { text: "Proceed with caution", action: () => resolveExploration(char) }
    ];
}

function generateMysteryChoices(char) {
    return [
        { text: "Try to solve it intellectually", action: () => resolveMystery(char) },
        { text: "Use your Willpower to endure", action: () => resolveMystery(char) },
        { text: "Walk away from the mystery", action: () => showMessage("You decide not to get involved.") }
    ];
}

// ==================== RESOLUTION FUNCTIONS ====================
function resolveCombat(char, method) {
    let message = "";
    let success = false;

    if (method === "weapon") {
        let damage = char.weapon.damage + (char.strength * 2);
        const weaponElement = char.weapon.element;
        const armorElement = char.armor.element;

        if (armorElement !== "None") {
            if (weaponElement === armorElement) {
                damage = Math.floor(damage * 0.75);
            } else {
                damage = Math.floor(damage * 1.25);
            }
        }

        success = damage > 55;
        message = success 
            ? `You deal ${damage} damage and defeat the enemy.` 
            : "Your attack is partially resisted.";
    } 
    else if (method === "psionic") {
        success = char.willpower >= 12;
        message = success 
            ? "Your psionic attack overwhelms the enemy." 
            : "The psionic feedback damages you instead.";
    } 
    else if (method === "social") {
        success = char.presence >= 13;
        message = success 
            ? "You talk your way out of the fight." 
            : "Your words only make things worse.";
    } 
    else if (method === "flee") {
        success = char.reflexes >= 12;
        message = success 
            ? "You successfully escape." 
            : "You fail to escape and are forced to fight.";
    }

    showMessage(message);
    showChoices([
        { text: "Continue", action: () => goToLocation(gameState.location) }
    ]);
}

function resolveSocial(char) {
    const success = char.presence >= 12;
    showMessage(success ? "Your charm wins them over." : "The conversation goes poorly.");
    showChoices([
        { text: "Continue", action: () => goToLocation(gameState.location) }
    ]);
}

function resolvePsionic(char) {
    const success = char.willpower >= 13;
    showMessage(success ? "You successfully navigate the psionic phenomenon." : "You suffer psionic feedback.");
    showChoices([
        { text: "Continue", action: () => goToLocation(gameState.location) }
    ]);
}

function resolveTrade(char) {
    const success = char.intelligence >= 12;
    showMessage(success ? "You secure a profitable deal." : "The deal falls through.");
    showChoices([
        { text: "Continue", action: () => goToLocation(gameState.location) }
    ]);
}

function resolveExploration(char) {
    showMessage("You discover something interesting but dangerous.");
    showChoices([
        { text: "Continue", action: () => goToLocation(gameState.location) }
    ]);
}

function resolveMystery(char) {
    const success = char.intelligence >= 14;
    showMessage(success ? "You uncover valuable information." : "The mystery remains unsolved.");
    showChoices([
        { text: "Continue", action: () => goToLocation(gameState.location) }
    ]);
}

// ==================== OTHER EVENTS ====================
function eavesdrop() {
    const char = gameState.character;
    if (char.intelligence >= 14) {
        gameState.favor += 1;
        showMessage("You overhear valuable information. (+1 Favor)");
    } else {
        gameState.suspicion += 1;
        showMessage("You get caught. (+1 Suspicion)");
    }
    updateUI();
    showChoices([
        { text: "Continue", action: () => goToLocation(gameState.location) }
    ]);
}

function investigateShip() {
    const char = gameState.character;
    if (char.weapon && char.weapon.element === "Plasma") {
        showMessage("Your Plasma weapon gives you an edge.");
        gameState.favor += 1;
    } else {
        showMessage("The ship leaves before you learn much.");
    }
    updateUI();
    showChoices([
        { text: "Return to main area", action: () => goToLocation("Nexus Trade World") }
    ]);
}

function scanAnomaly() {
    const char = gameState.character;
    if (char.intelligence >= 14) {
        showMessage("You detect Nullborn energy. (+1 Favor)");
        gameState.favor += 1;
    } else {
        showMessage("The anomaly affects you. (+1 Suspicion)");
        gameState.suspicion += 1;
    }
    updateUI();
    showChoices([
        { text: "Return to main area", action: () => goToLocation("Nexus Trade World") }
    ]);
}

// ==================== GAME START ====================
function startNewGame() {
    gameState.character = {
        name: "New Operative",
        species: "Human",
        affiliation: "Independent",
        strength: 10,
        reflexes: 10,
        intelligence: 10,
        willpower: 10,
        presence: 10,
        weapon: { name: "Plasma Pistol", element: "Plasma", damage: 35 },
        armor: { name: "Standard Vest", tier: "Common", element: "None" }
    };
    gameState.favor = 0;
    gameState.suspicion = 0;
    updateUI();
    showMessage("You wake up in a hab-module on the Nexus Trade World.");
    showChoices([
        { text: "Explore the station", action: () => goToLocation("Trading Hall") }
    ]);
}

function loadSavedCharacter() {
    alert("Load feature coming soon.");
}

function saveGame() {
    if (!gameState.character) return alert("No character to save.");
    localStorage.setItem('sleepingEmpireSave', JSON.stringify(gameState));
    alert("Game saved!");
}

updateUI();
</script>
</body>
</html>
