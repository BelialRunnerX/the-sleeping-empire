<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sleeping Empire - Text Adventure</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        #game-area { background: #1a1a1a; padding: 25px; border-radius: 10px; min-height: 280px; margin-bottom: 20px; }
        .choice { background: #1a3c6e; color: white; border: none; padding: 12px 20px; margin: 8px 0; width: 100%; text-align: left; cursor: pointer; }
        .choice:hover { background: #2a5aa0; }
        .status { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        button { background: #1a3c6e; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }
        button:hover { background: #2a5aa0; }
        h1 { color: #4fc3f7; }
        canvas { border: 1px solid #333; background: #000; }
    </style>
</head>
<body>
<div class="container">
    <h1>The Sleeping Empire - Text Adventure</h1>
    
    <div class="status">
        <strong>Character:</strong> <span id="char-name">None Loaded</span><br>
        <strong>Location:</strong> <span id="location">Nexus Trade World</span><br>
        <strong>Favor:</strong> <span id="favor">0</span> | <strong>Suspicion:</strong> <span id="suspicion">0</span>
    </div>

    <div style="display: flex; gap: 30px; align-items: flex-start;">
        <!-- Map -->
        <div>
            <h3>Map</h3>
            <canvas id="map-canvas" width="500" height="500"></canvas>
            <p style="font-size: 0.85rem; color: #888;">Click discovered tiles to fast travel. New tiles trigger encounters.</p>
        </div>

        <!-- Game Area -->
        <div style="flex: 1;">
            <div id="game-area">
                <p>Welcome. Load a character or start a new game.</p>
            </div>
            <div id="choices"></div>
        </div>
    </div>

    <div style="margin-top: 30px;">
        <button onclick="loadSavedCharacter()">Load Character</button>
        <button onclick="startNewGame()">New Game</button>
        <button onclick="saveGame()">Save Game</button>
    </div>
</div>

<script>
// ==================== GAME STATE ====================
let gameState = {
    character: null,
    location: "Nexus Trade World",
    favor: 0,
    suspicion: 0,
    storyFlags: {}
};

let playerPos = { x: 2, y: 2 };
let discovered = new Set(["2,2"]);
let hoverTile = null;

const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');

const mapSize = 5;
const tileSize = 100;

const locationTypes = {
    "0,0": { name: "The Nullspire Perimeter", type: "danger", color: "#6a1b9a", icon: "⚠" },
    "1,0": { name: "Outer Ring Hab-Modules", type: "neutral", color: "#37474f", icon: "⬡" },
    "2,0": { name: "Observation Deck", type: "exploration", color: "#0288d1", icon: "🔭" },
    "3,0": { name: "Senate District", type: "political", color: "#f9a825", icon: "🏛" },
    "4,0": { name: "Imperial Archives", type: "mystery", color: "#7b1fa2", icon: "📜" },
    "0,1": { name: "Lower Markets", type: "trade", color: "#43a047", icon: "💰" },
    "1,1": { name: "Docking Bays", type: "trade", color: "#00838f", icon: "🚀" },
    "2,1": { name: "Nexus Trade World", type: "hub", color: "#1e88e5", icon: "✦" },
    "3,1": { name: "Trading Hall", type: "trade", color: "#2e7d32", icon: "🛒" },
    "4,1": { name: "Voidspire District", type: "danger", color: "#6a1b9a", icon: "⚠" },
    "0,2": { name: "Maintenance Sublevels", type: "exploration", color: "#455a64", icon: "🔧" },
    "1,2": { name: "Security Outpost", type: "political", color: "#f9a825", icon: "🛡" },
    "2,2": { name: "Central Plaza", type: "hub", color: "#1565c0", icon: "✦" },
    "3,2": { name: "Diplomatic Quarter", type: "political", color: "#f9a825", icon: "🤝" },
    "4,2": { name: "Research Wing", type: "mystery", color: "#7b1fa2", icon: "🔬" },
    "0,3": { name: "Cargo Processing", type: "trade", color: "#00838f", icon: "📦" },
    "1,3": { name: "Engineering Bay", type: "exploration", color: "#455a64", icon: "⚙" },
    "2,3": { name: "Theater District", type: "neutral", color: "#37474f", icon: "🎭" },
    "3,3": { name: "Medical District", type: "neutral", color: "#37474f", icon: "⚕" },
    "4,3": { name: "Psionic Research Lab", type: "psionic", color: "#8e24aa", icon: "🧠" },
    "0,4": { name: "Defense Perimeter", type: "danger", color: "#6a1b9a", icon: "⚠" },
    "1,4": { name: "Fleet Command", type: "political", color: "#f9a825", icon: "🎖" },
    "2,4": { name: "The Grand Atrium", type: "hub", color: "#1565c0", icon: "✦" },
    "3,4": { name: "Cultural Exchange", type: "neutral", color: "#37474f", icon: "🌐" },
    "4,4": { name: "The Spire", type: "mystery", color: "#7b1fa2", icon: "🔮" }
};

function drawMap(highlightPath = []) {
    ctx.fillStyle = "#000011";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Starfield
    ctx.fillStyle = "#ffffff";
    for (let i = 0; i < 100; i++) {
        const x = (i * 41) % canvas.width;
        const y = (i * 67) % canvas.height;
        const size = (i % 3) + 1;
        ctx.fillRect(x, y, size, size);
    }
    
    for (let x = 0; x < mapSize; x++) {
        for (let y = 0; y < mapSize; y++) {
            const key = `${x},${y}`;
            const loc = locationTypes[key];
            const isPlayer = playerPos.x === x && playerPos.y === y;
            const isDiscovered = discovered.has(key);
            const isHovered = hoverTile && hoverTile.x === x && hoverTile.y === y;
            const isPath = highlightPath.some(p => p.x === x && p.y === y);
            
            if (isDiscovered) {
                ctx.fillStyle = loc ? loc.color : "#1a1a2e";
                ctx.globalAlpha = isHovered ? 0.85 : 0.6;
                ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                ctx.globalAlpha = 1.0;
                
                if (loc && loc.icon) {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "22px Arial";
                    ctx.fillText(loc.icon, x * tileSize + 35, y * tileSize + 55);
                }
            } else {
                ctx.fillStyle = "#0a0a12";
                ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
            }
            
            ctx.strokeStyle = isPath ? "#00e5ff" : "#333";
            ctx.lineWidth = isPath ? 3 : 1;
            ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
            ctx.lineWidth = 1;
            
            if (isPlayer) {
                ctx.fillStyle = "#00e5ff";
                ctx.beginPath();
                ctx.arc(x * tileSize + tileSize/2, y * tileSize + tileSize/2, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.font = "bold 18px Arial";
                ctx.fillText("P", x * tileSize + 32, y * tileSize + 58);
            }
        }
    }
    
    // Hover label
    if (hoverTile) {
        const key = `${hoverTile.x},${hoverTile.y}`;
        const loc = locationTypes[key];
        if (loc && discovered.has(key)) {
            ctx.fillStyle = "rgba(0,0,0,0.85)";
            ctx.fillRect(hoverTile.x * tileSize, hoverTile.y * tileSize - 28, tileSize, 24);
            ctx.fillStyle = "#fff";
            ctx.font = "12px Arial";
            ctx.fillText(loc.name, hoverTile.x * tileSize + 5, hoverTile.y * tileSize - 10);
        }
    }
}

canvas.addEventListener('mousemove', function(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = Math.floor((e.clientX - rect.left) / tileSize);
    const my = Math.floor((e.clientY - rect.top) / tileSize);
    
    if (mx >= 0 && mx < mapSize && my >= 0 && my < mapSize) {
        hoverTile = { x: mx, y: my };
    } else {
        hoverTile = null;
    }
    drawMap();
});

canvas.addEventListener('click', function(e) {
    const rect = canvas.getBoundingClientRect();
    const clickX = Math.floor((e.clientX - rect.left) / tileSize);
    const clickY = Math.floor((e.clientY - rect.top) / tileSize);
    
    if (clickX >= 0 && clickX < mapSize && clickY >= 0 && clickY < mapSize) {
        const key = `${clickX},${clickY}`;
        
        if (discovered.has(key)) {
            const path = findPath(playerPos, { x: clickX, y: clickY });
            if (path.length > 0) {
                animatePath(path);
            }
        } else {
            playerPos.x = clickX;
            playerPos.y = clickY;
            discovered.add(key);
            
            const locData = locationTypes[key];
            gameState.location = locData ? locData.name : "Unknown Area";
            updateUI();
            drawMap();
            
            const encounterChance = getEncounterChance(locData);
            if (Math.random() < encounterChance) {
                setTimeout(() => triggerAdvancedEncounter(), 600);
            }
        }
    }
});

function findPath(start, end) {
    const queue = [{ pos: start, path: [] }];
    const visited = new Set();
    
    while (queue.length > 0) {
        const { pos, path } = queue.shift();
        const key = `${pos.x},${pos.y}`;
        
        if (pos.x === end.x && pos.y === end.y) {
            return path;
        }
        
        if (visited.has(key)) continue;
        visited.add(key);
        
        const neighbors = [
            { x: pos.x + 1, y: pos.y },
            { x: pos.x - 1, y: pos.y },
            { x: pos.x, y: pos.y + 1 },
            { x: pos.x, y: pos.y - 1 }
        ];
        
        for (const n of neighbors) {
            const nKey = `${n.x},${n.y}`;
            if (n.x >= 0 && n.x < mapSize && n.y >= 0 && n.y < mapSize && discovered.has(nKey)) {
                queue.push({ pos: n, path: [...path, n] });
            }
        }
    }
    return [];
}

function animatePath(path) {
    let i = 0;
    const interval = setInterval(() => {
        if (i < path.length) {
            playerPos = path[i];
            const key = `${playerPos.x},${playerPos.y}`;
            discovered.add(key);
            
            const locData = locationTypes[key];
            gameState.location = locData ? locData.name : "Unknown Area";
            updateUI();
            drawMap();
            i++;
        } else {
            clearInterval(interval);
            
            const locData = locationTypes[`${playerPos.x},${playerPos.y}`];
            const encounterChance = getEncounterChance(locData);
            if (Math.random() < encounterChance) {
                setTimeout(() => triggerAdvancedEncounter(), 500);
            }
        }
    }, 220);
}

function getEncounterChance(locData) {
    if (!locData) return 0.15;
    switch (locData.type) {
        case "danger": return 0.55;
        case "psionic": return 0.50;
        case "mystery": return 0.40;
        case "political": return 0.35;
        case "exploration": return 0.35;
        case "trade": return 0.25;
        case "hub": return 0.20;
        default: return 0.15;
    }
}

// Initial draw
drawMap();

// ==================== REST OF THE GAME LOGIC ====================
// (Keeping the rest of the game state, UI, and encounter system from previous version)

let gameState = {
    character: null,
    location: "Nexus Trade World",
    favor: 0,
    suspicion: 0,
    storyFlags: {}
};

function updateUI() {
    if (!gameState.character) return;
    document.getElementById('char-name').innerText = gameState.character.name;
    document.getElementById('location').innerText = gameState.location;
    document.getElementById('favor').innerText = gameState.favor;
    document.getElementById('suspicion').innerText = gameState.suspicion;
}

function showMessage(text) {
    document.getElementById('game-area').innerHTML = `<p>${text}</p>`;
}

function showChoices(choices) {
    const container = document.getElementById('choices');
    container.innerHTML = '';
    
    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.innerText = choice.text;
        btn.onclick = choice.action;
        container.appendChild(btn);
    });
}

function startNewGame() {
    gameState.character = {
        name: "New Operative",
        species: "Human",
        affiliation: "Independent",
        strength: 10,
        reflexes: 10,
        intelligence: 10,
        willpower: 10,
        presence: 10,
        weapon: { name: "Plasma Pistol", element: "Plasma", damage: 35 },
        armor: { name: "Standard Vest", tier: "Common", element: "None" }
    };
    gameState.favor = 0;
    gameState.suspicion = 0;
    updateUI();
    showMessage("You wake up in a hab-module on the Nexus Trade World.");
    showChoices([
        { text: "Explore the station", action: () => goToLocation("Trading Hall") }
    ]);
}

function saveGame() {
    if (!gameState.character) return alert("No character to save.");
    localStorage.setItem('sleepingEmpireSave', JSON.stringify(gameState));
    alert("Game saved!");
}

function loadSavedCharacter() {
    alert("Load feature coming soon.");
}

updateUI();
</script>
</body>
</html>
