<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sleeping Empire - Text Adventure</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        #game-area { background: #1a1a1a; padding: 25px; border-radius: 10px; min-height: 280px; margin-bottom: 20px; }
        .choice { background: #1a3c6e; color: white; border: none; padding: 12px 20px; margin: 8px 0; width: 100%; text-align: left; cursor: pointer; }
        .choice:hover { background: #2a5aa0; }
        .status { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        button { background: #1a3c6e; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }
        button:hover { background: #2a5aa0; }
        h1 { color: #4fc3f7; }
    </style>
</head>
<body>
<div class="container">
    <h1>The Sleeping Empire - Text Adventure</h1>
    
    <div class="status">
        <strong>Character:</strong> <span id="char-name">None Loaded</span><br>
        <strong>Location:</strong> <span id="location">Nexus Trade World</span><br>
        <strong>Favor:</strong> <span id="favor">0</span> | <strong>Suspicion:</strong> <span id="suspicion">0</span>
    </div>

    <div id="game-area">
        <p>Welcome. Load a character or start a new game.</p>
    </div>

    <div id="choices"></div>

    <div style="margin-top: 30px;">
        <button onclick="loadSavedCharacter()">Load Character</button>
        <button onclick="startNewGame()">New Game</button>
        <button onclick="triggerRandomEvent()">Random Event</button>
        <button onclick="saveGame()">Save Game</button>
    </div>
</div>

<script>
// ==================== GAME STATE ====================
let gameState = {
    character: null,
    location: "Nexus Trade World",
    favor: 0,
    suspicion: 0,
    storyFlags: {}
};

function updateUI() {
    if (!gameState.character) return;
    document.getElementById('char-name').innerText = gameState.character.name;
    document.getElementById('location').innerText = gameState.location;
    document.getElementById('favor').innerText = gameState.favor;
    document.getElementById('suspicion').innerText = gameState.suspicion;
}

// ==================== STORY & CHOICES ====================
function showMessage(text) {
    document.getElementById('game-area').innerHTML = `<p>${text}</p>`;
}

function showChoices(choices) {
    const container = document.getElementById('choices');
    container.innerHTML = '';
    
    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.innerText = choice.text;
        btn.onclick = choice.action;
        container.appendChild(btn);
    });
}

// ==================== LOCATIONS ====================
function goToLocation(location) {
    gameState.location = location;
    updateUI();
    
    let text = `You arrive at the ${location}.`;
    let choices = [];

    if (location === "Trading Hall") {
        text += " Merchants from various factions are active.";
        choices = [
            { text: "Look for trade opportunities", action: () => triggerRandomEvent() },
            { text: "Eavesdrop on conversations", action: () => eavesdrop() },
            { text: "Return to main area", action: () => goToLocation("Nexus Trade World") }
        ];
    } 
    else if (location === "Docking Bays") {
        text += " Several ships are docked, including an unmarked vessel.";
        choices = [
            { text: "Investigate the unmarked ship", action: () => investigateShip() },
            { text: "Speak with a dock worker", action: () => triggerRandomEvent() },
            { text: "Return to main area", action: () => goToLocation("Nexus Trade World") }
        ];
    } 
    else if (location === "Observation Deck") {
        text += " You notice strange energy readings in the distance.";
        choices = [
            { text: "Scan the anomaly", action: () => scanAnomaly() },
            { text: "Return to main area", action: () => goToLocation("Nexus Trade World") }
        ];
    }

    showMessage(text);
    showChoices(choices);
}

// ==================== BRANCHING EVENTS WITH GEAR INTEGRATION ====================
function eavesdrop() {
    const char = gameState.character;
    if (char.intelligence >= 14) {
        gameState.favor += 1;
        showMessage("You overhear valuable information. (+1 Favor)");
    } else if (char.reflexes >= 12) {
        showMessage("You barely avoid being caught.");
    } else {
        gameState.suspicion += 1;
        showMessage("You get caught. (+1 Suspicion)");
    }
    updateUI();
    showChoices([
        { text: "Continue", action: () => goToLocation(gameState.location) }
    ]);
}

function investigateShip() {
    const char = gameState.character;
    if (char.weapon && char.weapon.element === "Plasma") {
        showMessage("Your Plasma weapon gives you an edge. You find restricted tech.");
        gameState.favor += 1;
    } else if (char.armor && char.armor.tier === "Legendary") {
        showMessage("Your Legendary armor protects you while investigating.");
    } else {
        showMessage("The ship leaves before you learn much.");
    }
    updateUI();
    showChoices([
        { text: "Return to main area", action: () => goToLocation("Nexus Trade World") }
    ]);
}

function scanAnomaly() {
    const char = gameState.character;
    if (char.intelligence >= 14) {
        showMessage("You detect Nullborn energy. (+1 Favor)");
        gameState.favor += 1;
    } else if (char.willpower >= 13) {
        showMessage("You resist the energy and gather basic readings.");
    } else {
        showMessage("The anomaly affects you. (+1 Suspicion)");
        gameState.suspicion += 1;
    }
    updateUI();
    showChoices([
        { text: "Return to main area", action: () => goToLocation("Nexus Trade World") }
    ]);
}

// ==================== RANDOM EVENT SYSTEM WITH GEAR CHECKS ====================
function triggerRandomEvent() {
    const char = gameState.character;
    if (!char) {
        alert("Please generate or load a character first.");
        return;
    }

    const roll = Math.random();
    let outcome = "";
    let isGood = null;

    // Gear-based branching
    if (char.weapon && char.weapon.element === "Dimensional" && roll < 0.35) {
        outcome = "Your Dimensional weapon reacts to the situation, giving you an advantage.";
        isGood = true;
    } 
    else if (char.armor && char.armor.tier === "Legendary" && roll < 0.35) {
        outcome = "Your Legendary armor protects you from harm.";
        isGood = true;
    } 
    else if (char.armor && char.armor.element === "Void" && roll < 0.35) {
        outcome = "Your Void-infused armor shields you from an unexpected threat.";
        isGood = true;
    } 
    else {
        if (roll < 0.33) {
            outcome = "You gain a useful contact or resource.";
            isGood = true;
        } else if (roll < 0.66) {
            outcome = "You suffer a minor setback.";
            isGood = false;
        } else {
            outcome = "The situation resolves with mixed results.";
            isGood = null;
        }
    }

    const className = isGood === true ? "good" : isGood === false ? "bad" : "neutral";
    showMessage(outcome);
    showChoices([
        { text: "Continue", action: () => goToLocation(gameState.location) }
    ]);
}

// ==================== GAME START ====================
function startNewGame() {
    gameState.character = {
        name: "New Operative",
        species: "Human",
        affiliation: "Independent",
        strength: 10,
        reflexes: 10,
        intelligence: 10,
        willpower: 10,
        presence: 10,
        weapon: { name: "Plasma Pistol", element: "Plasma" },
        armor: { name: "Standard Vest", tier: "Common", element: "None" }
    };
    gameState.favor = 0;
    gameState.suspicion = 0;
    updateUI();
    showMessage("You wake up in a hab-module on the Nexus Trade World.");
    showChoices([
        { text: "Explore the station", action: () => goToLocation("Trading Hall") }
    ]);
}

function loadSavedCharacter() {
    alert("Load feature coming soon.");
}

function saveGame() {
    if (!gameState.character) return alert("No character to save.");
    localStorage.setItem('sleepingEmpireSave', JSON.stringify(gameState));
    alert("Game saved!");
}

updateUI();
</script>
</body>
</html>
