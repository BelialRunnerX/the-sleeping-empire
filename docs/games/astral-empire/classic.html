  function battleMove(move){
 if(!battle||battle.phase!=='playing')return;
 const f=activeFighter();if(!f)return;
 const h=HERO_BY_ID[f.id],st=hstats(h.id),enemy=battle.enemy;
 if(move==='burst'&&f.energy<100){notify('Need 100 energy to unleash the Burst!');return;}
 if(!['attack','skill','burst','guard'].includes(move))return;
 const crit=Math.random()<(.17+(h.role==='Assassin'?.07:0));
 const variance=.92+Math.random()*.16;
 const def=enemy.def*(enemy.exposed>0?.55:1);
 let damage=0,heal=0;
 if(move==='attack'){
   damage=Math.max(1,Math.floor((st.atk*1.12-def*.55)*variance*(crit?1.55:1)));
   f.energy=clamp(f.energy+25,0,100);
 }else if(move==='skill'){
   if(h.role==='Healer'){
     heal=Math.floor(st.atk*1.8+st.hp*.10);
     for(const x of battle.team)if(x.hp>0)x.hp=Math.min(x.max,x.hp+heal);
     damage=Math.max(1,Math.floor(st.atk*.55-def*.2));
   }else if(h.role==='Guardian'){
     f.guard=true;heal=Math.floor(f.max*.11);f.hp=Math.min(f.max,f.hp+heal);
     damage=Math.max(1,Math.floor(st.atk*1.35-def*.45));
   }else damage=Math.max(1,Math.floor((st.atk*1.68-def*.46)*variance*(crit?1.55:1)));
   f.energy=clamp(f.energy+34,0,100);
 }else if(move==='burst'){
   damage=Math.max(1,Math.floor((st.atk*(h.role==='Healer'?2.6:3.25+(state.heroes[h.id].awakened||0)*.08)-def*.24)*variance));
   if(h.role==='Healer')for(const x of battle.team)if(x.hp>0)x.hp=Math.min(x.max,x.hp+Math.floor(st.atk*2.2));
   f.energy=0;
 }else{
   heal=Math.floor(f.max*.16);f.hp=Math.min(f.max,f.hp+heal);f.guard=true;f.energy=clamp(f.energy+18,0,100);
   logBattle(h.name+' braces, recovering '+heal+' HP and drawing enemy attention.');
 }
 if(move!=='guard'){
   if(battle.lastElement&&battle.lastElement!==h.element)battle.combo=Math.min(10,battle.combo+1);
   else if(battle.lastElement===h.element)battle.combo=Math.max(0,battle.combo-1);
   const reaction=reactionFor(enemy.aura,h.element);
   const elementMod=elementalMultiplier(h.element,enemy.element);
   damage=Math.max(1,Math.floor(damage*(1+battle.combo*.045)*elementMod));
   if(reaction){
     const extra=Math.max(1,Math.floor(damage*reaction.bonus));
     damage+=extra;battle.reactions++;
     logBattle('✦ '+reaction.name+'! '+extra+' bonus damage.');
     if(reaction.effect==='burn'){enemy.burn=Math.max(enemy.burn||0,3);enemy.burnPower=Math.floor(st.atk*.35);}
     if(reaction.effect==='weaken')enemy.weaken=Math.max(enemy.weaken||0,2);
     if(reaction.effect==='expose')enemy.exposed=Math.max(enemy.exposed||0,2);
     if(reaction.effect==='energize')for(const ally of battle.team)if(ally.hp>0)ally.energy=clamp(ally.energy+16,0,100);
     if(reaction.effect==='heal')for(const ally of battle.team)if(ally.hp>0)ally.hp=Math.min(ally.max,ally.hp+Math.floor(ally.max*.08));
   }
   enemy.aura=h.element;battle.lastElement=h.element;
   enemy.current=Math.max(0,enemy.current-damage);
   const actionName=move==='burst'?h.burst:move==='skill'?h.skill:'Attack';
   logBattle(h.name+' · '+actionName+': '+fmt(damage)+' '+h.element+' damage'+(crit&&move!=='burst'?' · CRITICAL':'')+'.');
   battle.fx={kind:move,damage,label:reaction?.name||(crit?'CRITICAL!':''),element:h.element,crit};
 }else battle.fx={kind:'guard',damage:0,label:'GUARD',element:h.element,crit:false};
 if(enemy.current<=0){battleVictory();return;}
 if(enemy.burn>0){
   const dot=Math.max(8,enemy.burnPower||10);
   enemy.current=Math.max(0,enemy.current-dot);enemy.burn--;
   logBattle('🔥 Wildfire burns for '+fmt(dot)+' damage.');
   if(enemy.current<=0){battleVictory();return;}
 }
 const intent=enemyIntent(battle.turn,battle.stage%5===0||battle.mode==='trial');
 const living=battle.team.filter(x=>x.hp>0);
 const targets=intent.type==='cataclysm'?living:[move==='guard'?f:intent.type==='charged'?f:random(living)];
 const weakened=enemy.weaken>0?.72:1;
 for(const target of targets){
   if(target.hp<=0)continue;
   const stats=hstats(target.id);
   let hit=Math.max(1,Math.floor((enemy.atk-stats.def*.4)*(.88+Math.random()*.2)*(intent.type==='cataclysm'?1.08:intent.type==='charged'?1.7:1)*weakened));
   if(target.guard)hit=Math.max(1,Math.floor(hit*.42));
   target.hp=Math.max(0,target.hp-hit);target.guard=false;
   logBattle(enemy.name+' · '+intent.name+' hits '+HERO_BY_ID[target.id].name+' for '+fmt(hit)+'.');
   if(target.hp<=0)logBattle('☠ '+HERO_BY_ID[target.id].name+' has fallen.');
 }
 enemy.weaken=Math.max(0,(enemy.weaken||0)-1);enemy.exposed=Math.max(0,(enemy.exposed||0)-1);
 battle.turn++;
 if(!battle.team.some(x=>x.hp>0)){battle.phase='lost';logBattle('DEFEAT. Strengthen your squad and return to the Rift.');}
 else if(battle.team[battle.active].hp<=0)battle.active=battle.team.findIndex(x=>x.hp>0);
 render();
}

    ${running?`<div class="panel pad dispatch-active"><span class="eyebrow">ACTIVE DISPATCH</span><h2>${entry.icon} ${entry.title}</h2><p class="smalltext">${remaining?'Mission underway. Return when the timer reaches zero.':'Mission complete! Your rewards are ready.'}</p><div class="dispatch-timer" data-expedition-timer>${remaining?formatDuration(remaining):'READY TO CLAIM'}</div><div class="flex" style="flex-wrap:wrap">${running.team.map(id=>`<span class="tag">${esc(HERO_BY_ID[id].name)}</span>`).join('')}</div><button class="btn gold" data-action="claim-expedition" ${remaining?'disabled':''} style="margin-top:16px">✦ CLAIM EXPEDITION REWARDS</button></div>`:'<p class="notice">No active expedition. Select a mission below to dispatch your current squad.</p>'}
    <div class="dispatch-grid">${EXPEDITIONS.map(x=>`<article class="panel pad dispatch-card"><div class="dispatch-icon">${x.icon}</div><h3>${x.title}</h3><p class="smalltext">${x.description}</p><div class="dispatch-duration">◷ ${x.minutes} MINUTES</div><p class="smalltext">💎 ${x.crystals} · 🪙 ${x.gold}${x.ore?' · ⛏ '+x.ore:''}${x.gems?' · 🔮 '+x.gems:''}</p><button class="btn primary full" data-action="start-expedition" data-id="${x.id}" ${running?'disabled':''}>DISPATCH SQUAD →</button></article>`).join('')}</div>
    <div class="sectionhead"><h2>Imperial Achievements</h2><small>${state.expeditionsCompleted} expeditions completed</small></div><div class="panel pad"><div class="quest-list">${ACHIEVEMENTS.map(a=>{const n=Math.min(a.goal,a.value());const done=n>=a.goal,claimed=!!state.achievementClaims[a.id];return `<div class="quest"><div class="quest-icon">${a.icon}</div><div class="quest-main"><b>${a.name}</b><p>${a.description} · ${n}/${a.goal} · 💎 ${a.reward}</p><div class="progress"><i style="width:${n/a.goal*100}%"></i></div></div><button class="btn small ${done&&!claimed?'gold':'subtle'}" data-action="claim-achievement" data-id="${a.id}" ${!done||claimed?'disabled':''}>${claimed?'✓':done?'CLAIM':'LOCKED'}</button></div>`}).join('')}</div></div>`;
  }
  function formatDuration(seconds){const m=Math.floor(seconds/60),s=seconds%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
  function startExpedition(id){const mission=EXPEDITIONS.find(x=>x.id===id);if(!mission||state.expedition)return;const team=state.team.filter(x=>state.heroes[x]);if(!team.length){notify('Select a squad first.');return;}state.expedition={kind:id,ends:Date.now()+mission.minutes*60000,team:[...team]};save();render();notify('Expedition launched!');}
  function claimExpedition(){const e=state.expedition;if(!e||Date.now()<e.ends)return;const mission=EXPEDITIONS.find(x=>x.id===e.kind);if(!mission)return;state.crystals+=mission.crystals;state.gold+=mission.gold;state.ore+=mission.ore;state.gems+=mission.gems;state.expeditionsCompleted++;state.expedition=null;save();render();notify('Expedition complete! Resources delivered to the treasury.');}
  function claimAchievement(id){const a=ACHIEVEMENTS.find(x=>x.id===id);if(!a||state.achievementClaims[id]||a.value()<a.goal)return;state.crystals+=a.reward;state.achievementClaims[id]=true;save();render();notify('Achievement unlocked! +'+a.reward+' crystals');}
  setInterval(()=>{if(page!=='expeditions'||!state.expedition||modal)return;const t=el('app')?.querySelector('[data-expedition-timer]');if(!t)return;const remain=Math.max(0,Math.ceil((state.expedition.ends-Date.now())/1000));if(remain===0){render();return;}t.textContent=formatDuration(remain);},1000);

  function onAction(node){const action=node.dataset.action,id=node.dataset.id;
    if(action==='profile-pick'){const input=el('auth-name');if(input)input.value=node.dataset.name||'';return;}
    if(action==='login-profile'){enterProfile(false,node);return;}
    if(action==='create-profile'){enterProfile(true,node);return;}
    if(action==='logout-profile'){logoutProfile();return;}
    if(!activeProfile)return;
    if(action==='move-world'){moveWorld(Number(node.dataset.dx)||0,Number(node.dataset.dy)||0);return;}
    if(action==='harvest-world'){harvestWorld();return;}
    if(action==='craft-world'){craftWorld(id);return;}
    if(action==='travel-world'){travelWorld(id);return;}
    if(action==='world-encounter'){startWorldEncounter();return;}
    if(action==='next-battle'&&battle?.mode==='world'){battle=null;page='world';render();return;}
    if(action==='confirm-retreat'&&battle?.mode==='world'){battle=null;modal=null;page='world';render();return;}
    switch(action){case 'page':go(id);break;case 'start-expedition':startExpedition(id);break;case 'claim-expedition':claimExpedition();break;case 'claim-achievement':claimAchievement(id);break;case 'daily':daily();break;case 'claim':claim(id);break;case 'summon':summon(Number(node.dataset.count));break;case 'select-hero':selectedHero=id;render();break;case 'view-hero':modal={kind:'hero',id};renderModal();break;case 'goto-hero':selectedHero=id;go('roster');break;case 'team-toggle':teamToggle(id);break;case 'level-hero':levelHero(id);break;case 'awaken-hero':awakenHero(id);break;case 'craft':craft();break;case 'select-item':selectedItem=id;render();break;case 'forge-tab':forgeTab=id;render();break;case 'equip':equip(id);break;case 'unequip':unequip(id);break;case 'upgrade-item':upgradeItem(id);break;case 'reforge-item':reforgeItem(id);break;case 'socket-item':socketItem(id);break;case 'start-battle':initBattle(node.dataset.mode||'rift');break;case 'battle-select':battleSelect(Number(node.dataset.index));break;case 'battle-move':battleMove(node.dataset.move);break;case 'next-battle':battle=null;initBattle();break;case 'retry-battle':{const mode=battle?.mode||'rift';battle=null;initBattle(mode);break;}case 'retreat':modal={kind:'confirm',title:'Retreat from battle?',description:'Leave this battle without rewards. You can challenge the same stage again.',confirm:'retreat'};renderModal();break;case 'confirm-retreat':battle=null;modal=null;render();break;case 'close-modal':modal=null;renderModal();break;case 'export':exportSave();break;case 'import':el('import-file')?.click();break;case 'reset':modal={kind:'confirm',title:'Erase your progress?',description:'This permanently resets your current local save. Export a backup first if you want to keep your collection.',confirm:'reset'};renderModal();break;case 'confirm-reset':modal=null;resetSave();break;}}
  document.addEventListener('click',e=>{const node=e.target.closest('[data-action]');if(!node)return;if(node.dataset.action==='close-modal'&&e.target!==node&&node.classList.contains('modal-wrap'))return;e.preventDefault();onAction(node);});
  document.addEventListener('keydown',e=>{if(activeProfile&&page==='world'&&!modal&&!/INPUT|TEXTAREA|SELECT/.test(e.target?.tagName||'')){const d={w:[0,-1],ArrowUp:[0,-1],s:[0,1],ArrowDown:[0,1],a:[-1,0],ArrowLeft:[-1,0],d:[1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();moveWorld(...d);return;}if(e.key==='e'){e.preventDefault();harvestWorld();return;}}if(e.key==='Escape'&&modal){modal=null;renderModal();}if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('[role="button"][data-action]')){e.preventDefault();onAction(e.target);}});
  document.addEventListener('change',e=>{if(e.target.id==='import-file')importSave(e.target.files[0]);});
  window.addEventListener('pagehide',save);
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  render();
})();
</script>
</body>
</html>
